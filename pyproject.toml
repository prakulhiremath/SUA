[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sua"
version = "1.0.0"
description = "Sensitivity-Uncertainty Alignment: A Diagnostic for High-Risk Model Errors"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "transformers>=4.35",
    "datasets>=2.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "rich>=13.0",
    "evaluate>=0.4",
]

[project.optional-dependencies]
llm = ["bitsandbytes>=0.41", "accelerate>=0.23", "peft>=0.6"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "black>=23.0", "ruff>=0.1", "mypy>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
